name: WhatsApp tracker sync

on:
  schedule:
    # Morning digest at 08:07 and afternoon digest at 13:47 Santiago time.
    # Chile alternates between UTC minus 3 and UTC minus 4, so both UTC
    # variants are scheduled. The gate below activates only the cron that
    # matches the current Santiago offset.
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
    - cron: "47 16 * * *"
    - cron: "47 17 * * *"
  repository_dispatch:
    types: [whatsapp_command]
  workflow_dispatch:
    inputs:
      command:
        description: "Command text, e.g. 'pipeline' or 'update: Roche | interview'"
        required: false
        default: pipeline
      raw_message:
        description: "Send this exact text as a WhatsApp message instead of running a command (admin use, e.g. a one-off note)"
        required: false
        default: ""
      force_send:
        description: "Bypass same-day daily-digest deduplication"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Guards only against this workflow overlapping itself (e.g. a WhatsApp
# message arriving while a previous command is still mid-run) -- it does
# NOT serialize against discover.yml/mobile-sync.yml/sync_local.sh, which
# is what the retry loop in "Commit tracker changes" is for.
concurrency:
  group: whatsapp-sync-push
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine command text
        id: cmd
        env:
          DISPATCH_COMMAND: ${{ github.event.client_payload.command }}
          INPUT_COMMAND: ${{ github.event.inputs.command }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            text="pipeline"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            text="$DISPATCH_COMMAND"
          else
            text="$INPUT_COMMAND"
          fi
          {
            echo "text<<CMD_EOF"
            echo "$text"
            echo "CMD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check daily digest gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          INPUT_COMMAND: ${{ github.event.inputs.command }}
          RAW_MESSAGE: ${{ github.event.inputs.raw_message }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          set -e
          today=$(TZ=America/Santiago date +%F)
          is_daily=false
          slot=""
          skip=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            offset=$(TZ=America/Santiago date +%z)
            case "$SCHEDULE_EXPR|$offset" in
              "7 11 * * *|-0300"|"7 12 * * *|-0400") slot="morning" ;;
              "47 16 * * *|-0300"|"47 17 * * *|-0400") slot="afternoon" ;;
              *) skip=true ;;
            esac
            if [ -n "$slot" ]; then is_daily=true; fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$RAW_MESSAGE" ] && [ "${INPUT_COMMAND:-pipeline}" = "pipeline" ]; then
            is_daily=true
            hour=$(TZ=America/Santiago date +%H)
            if [ "$hour" -lt 12 ]; then slot="morning"; else slot="afternoon"; fi
          fi

          last_date=""
          last_slot=""
          if [ -f state/whatsapp_daily_digest.json ]; then
            last_date=$(python3 -c 'import json; print(json.load(open("state/whatsapp_daily_digest.json")).get("date", ""))')
            last_slot=$(python3 -c 'import json; print(json.load(open("state/whatsapp_daily_digest.json")).get("slot", "morning"))')
          fi

          if [ "$is_daily" = "true" ] && [ "$FORCE_SEND" != "true" ] && [ "$last_date" = "$today" ] && [ "$last_slot" = "$slot" ]; then
            skip=true
            echo "$slot digest already accepted on $today; skipping duplicate send."
          fi

          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "is_daily=$is_daily" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Run command against the tracker
        id: run
        if: steps.gate.outputs.skip != 'true'
        env:
          RAW_MESSAGE: ${{ github.event.inputs.raw_message }}
          CMD_TEXT: ${{ steps.cmd.outputs.text }}
          # last_local_sync_line() (discover_postings.py) shells out to
          # `gh api` to look up the last local-sync commit for the digest's
          # "Última sync local" line -- needs a token for that, same as
          # watchdog.yml's own gh api check.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -n "$RAW_MESSAGE" ]; then
            output="$RAW_MESSAGE"
            status=0
          else
            output=$(python3 tools/whatsapp_command.py \
              --tracker francisco-job-tracker-2026.html \
              raw "$CMD_TEXT" 2>&1)
            status=$?
          fi
          {
            echo "reply<<REPLY_EOF"
            echo "$output"
            echo "REPLY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Send WhatsApp reply
        if: steps.gate.outputs.skip != 'true'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          REPLY_TEXT: ${{ steps.run.outputs.reply }}
        run: python3 tools/send_whatsapp.py "$REPLY_TEXT"

      - name: Record daily digest delivery
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.is_daily == 'true'
        env:
          DIGEST_DATE: ${{ steps.gate.outputs.today }}
          DIGEST_SLOT: ${{ steps.gate.outputs.slot }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              "date": os.environ["DIGEST_DATE"],
              "slot": os.environ["DIGEST_SLOT"],
              "runId": int(os.environ["RUN_ID"]),
              "acceptedAt": datetime.now(timezone.utc).isoformat(),
              "source": f"scheduled_{os.environ['DIGEST_SLOT']}" if os.environ["EVENT_NAME"] == "schedule" else "manual_pipeline",
          }
          path = Path("state/whatsapp_daily_digest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = json.dumps(record, indent=2) + "\n"
          path.write_text(payload, encoding="utf-8")
          Path("/tmp/whatsapp_daily_digest.json").write_text(payload, encoding="utf-8")
          PY

      - name: Commit tracker changes
        if: steps.gate.outputs.skip != 'true' && steps.run.outputs.status == '0'
        env:
          RAW_MESSAGE: ${{ github.event.inputs.raw_message }}
          CMD_TEXT: ${{ steps.cmd.outputs.text }}
        run: |
          set -e
          git config user.name "jobs3-bot"
          git config user.email "jobs3-bot@users.noreply.github.com"
          git add francisco-job-tracker-2026.html state/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update via WhatsApp: $CMD_TEXT"
          # discover.yml, mobile-sync.yml, and the local sync_local.sh
          # LaunchAgent all write to this same main branch too. A bare
          # `git push` here can land in the gap right after this job's
          # checkout and get rejected with a plain
          # "! [rejected] ... (fetch first)", dropping this update even
          # though the WhatsApp reply already went out in the previous
          # step. See mobile-sync.yml and sync_local.sh for the same fix
          # already applied to the other two writers.
          #
          # The "Send WhatsApp reply" step already fired exactly once
          # above, so on retry we must NOT call send_whatsapp again --
          # only the tracker edit needs to be reproduced. On the first
          # push attempt we reuse the commit made above (from the "Run
          # command" step's output). If that's rejected, reset to a fresh
          # checkout and regenerate the edit by rerunning
          # whatsapp_command.py against the same $CMD_TEXT -- safe to
          # reapply because its status-update path is explicitly written
          # to be idempotent for exactly this case (see its "Not
          # idempotent otherwise" comment on interview-round dedup, added
          # to handle a retried/duplicate-delivered webhook). A plain
          # rebase isn't used here because the tracker's SAVED_DATA/
          # FAILED_SOURCES blocks and state/market_history_seen.json are
          # all regex-replaced whole, so two commits touching the same
          # block almost always textually conflict even when the
          # underlying edits don't actually clash.
          #
          # (A $RAW_MESSAGE admin run never reaches this loop at all --
          # it never touches the tracker, so "Nothing to commit" above
          # exits before any of this.)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt/5 -- another writer landed first, retrying from a fresh checkout..."
            git fetch origin main
            git reset --hard origin/main
            set +e
            output=$(python3 tools/whatsapp_command.py \
              --tracker francisco-job-tracker-2026.html \
              raw "$CMD_TEXT" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error::whatsapp_command.py failed on retry (exit $status) -- not a push race, not retrying further."
              exit "$status"
            fi
            if [ -f /tmp/whatsapp_daily_digest.json ]; then
              cp /tmp/whatsapp_daily_digest.json state/whatsapp_daily_digest.json
            fi
            git add francisco-job-tracker-2026.html state/
            if git diff --cached --quiet; then
              echo "Nothing to commit (already applied by another writer)."
              exit 0
            fi
            git commit -m "Update via WhatsApp: $CMD_TEXT"
          done
          echo "::error::All push attempts failed."
          exit 1
