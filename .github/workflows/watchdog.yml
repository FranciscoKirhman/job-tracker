name: Digest watchdog

# GitHub's scheduled-workflow cron is best-effort: it can be delayed or
# silently skipped under load (documented behavior, most likely for crons
# landing exactly on the hour -- see whatsapp.yml's schedule comment). This
# runs twice after the expected daily digest and checks the committed
# acceptance marker. If the primary cron was delayed or dropped, the first
# available watchdog run triggers one catch-up. The digest workflow itself
# suppresses a delayed duplicate after that catch-up lands.

on:
  schedule:
    # ~08:47 and ~09:47 Santiago time after the 08:07 primary digest.
    - cron: "47 12 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: whatsapp-digest-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's digest actually went out
        id: check
        run: |
          set -e
          today=$(TZ=America/Santiago date +%F)
          last_date=""
          if [ -f state/whatsapp_daily_digest.json ]; then
            last_date=$(python3 -c 'import json; print(json.load(open("state/whatsapp_daily_digest.json")).get("date", ""))')
          fi
          delivered=false
          if [ "$last_date" = "$today" ]; then
            delivered=true
          fi
          echo "Today in Santiago: $today; recorded digest date: ${last_date:-none}."
          echo "delivered=$delivered" >> "$GITHUB_OUTPUT"

      - name: Retry the digest
        if: steps.check.outputs.delivered == 'false'
        run: |
          echo "No accepted digest recorded for today -- triggering one catch-up run."
          gh workflow run whatsapp.yml -f command=pipeline
        env:
          GH_TOKEN: ${{ github.token }}
