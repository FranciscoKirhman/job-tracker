name: Mobile sync

# Triggered by a Cloudflare Worker (see docs/CLOUDFLARE_SYNC_SETUP.md) that
# phone swipes POST to. The Worker holds the actual GitHub credential and
# validates a shared secret from the app before forwarding here -- this
# workflow never talks to the phone directly, only to GitHub's own
# repository_dispatch event.
on:
  repository_dispatch:
    types: [mobile_sync]

# GitHub concurrency retains at most one pending run per group, so a burst of
# phone swipes can replace a queued event even when cancel-in-progress is false.
# Let every dispatch run. The fresh-checkout retry loop below serializes the
# actual writes safely when pushes race.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and commit (retries from a fresh checkout on push conflict)
        env:
          MS_ACTION: ${{ github.event.client_payload.action }}
          MS_COMPANY: ${{ github.event.client_payload.company }}
          MS_ROLE: ${{ github.event.client_payload.role }}
          MS_JOB_ID: ${{ github.event.client_payload.jobId }}
          MS_LOCATION: ${{ github.event.client_payload.location }}
          MS_FIT_SCORE: ${{ github.event.client_payload.fitScore }}
          MS_URL: ${{ github.event.client_payload.url }}
          MS_REASON: ${{ github.event.client_payload.reason }}
          MS_RISK: ${{ github.event.client_payload.risk }}
        run: |
          set -e
          git config user.name "jobs3-bot"
          git config user.email "jobs3-bot@users.noreply.github.com"
          # Each attempt resets to the true latest main and reruns
          # mobile_sync.py fresh, rather than rebasing the previous
          # attempt's stale commit -- SAVED_DATA/DISCARDED_POSTINGS are
          # regex-replaced whole, so two commits touching the same array
          # almost always textually conflict on rebase even though the
          # underlying edits (add/remove one entry) don't actually clash.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            set +e
            output=$(python3 tools/mobile_sync.py \
              --tracker francisco-job-tracker-2026.html \
              --action "$MS_ACTION" \
              --company "$MS_COMPANY" \
              --role "$MS_ROLE" \
              --job-id "$MS_JOB_ID" \
              --location "$MS_LOCATION" \
              --fit-score "$MS_FIT_SCORE" \
              --url "$MS_URL" \
              --reason "$MS_REASON" \
              --risk "$MS_RISK" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error::mobile_sync.py failed (exit $status) -- not a push race, not retrying."
              exit "$status"
            fi
            git add francisco-job-tracker-2026.html
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -m "Mobile sync: $MS_ACTION $MS_COMPANY"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt/5 -- another run landed first, retrying from a fresh checkout..."
          done
          echo "::error::All push attempts failed."
          exit 1
